name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run coverage-backed tests
        run: uv run --group test coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: uv run --group test coverage report

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Download FFmpeg bundle
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $bin = (Get-ChildItem $extractRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item (Join-Path $bin "ffmpeg.exe") .\ffmpeg.exe
          Copy-Item (Join-Path $bin "ffprobe.exe") .\ffprobe.exe
      - name: Build Steam Video Exporter
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1
      - name: Build Steam Quick Export
        run: powershell -ExecutionPolicy Bypass -File .\build-quick.ps1
      - name: Smoke-test Steam Quick Export bundle
        shell: pwsh
        run: |
          & .\dist-simple\SteamQuickExport\SteamQuickExport.exe --self-test --scan-self-test
          if ($LASTEXITCODE -ne 0) { throw "Steam Quick Export self-test failed ($LASTEXITCODE)" }
