name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run coverage-backed tests
        run: uv run --group test coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: uv run --group test coverage report
