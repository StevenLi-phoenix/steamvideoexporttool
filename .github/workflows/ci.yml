name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run coverage-backed tests
        run: uv run --group test coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: uv run --group test coverage report
      - name: Lint and check formatting
        run: |
          uv run --group lint ruff check .
          uv run --group lint ruff format --check .

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamQuickExport-${{ github.sha }}
          path: dist-simple\SteamQuickExport\
