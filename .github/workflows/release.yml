name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches the pyproject version
        shell: pwsh
        run: |
          $pyprojectVersion = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$pyprojectVersion") {
            throw "Tag $($env:GITHUB_REF_NAME) does not match pyproject.toml version v$pyprojectVersion"
          }
      - uses: ./.github/actions/build-app
        with:
          smoke-test-arguments: --self-test --scan-self-test
      - name: Package release files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          # Steam Quick Export: ffmpeg.exe/ffprobe.exe are plain files inside
          # the onedir bundle, so the no-ffmpeg variant is just a copy of that
          # folder with the two binaries stripped out.
          Compress-Archive -Path .\dist-simple\SteamQuickExport\* -DestinationPath ".\SteamQuickExport-$tag-win-x64-ffmpeg.zip"
          $noFfmpegDir = ".\dist-simple\SteamQuickExport-no-ffmpeg"
          Copy-Item .\dist-simple\SteamQuickExport $noFfmpegDir -Recurse
          Remove-Item (Join-Path $noFfmpegDir "ffmpeg.exe"), (Join-Path $noFfmpegDir "ffprobe.exe") -Force
          Compress-Archive -Path "$noFfmpegDir\*" -DestinationPath ".\SteamQuickExport-$tag-win-x64.zip"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds-${{ github.ref_name }}
          path: |
            SteamQuickExport-${{ github.ref_name }}-win-x64-ffmpeg.zip
            SteamQuickExport-${{ github.ref_name }}-win-x64.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "SteamQuickExport-$tag-win-x64-ffmpeg.zip",
            "SteamQuickExport-$tag-win-x64.zip"
          )
          # Re-running the workflow must not fail on an existing release.
          if (gh release view "$tag" > $null 2>&1) {
            gh release upload "$tag" @assets --clobber
          } else {
            gh release create "$tag" @assets --title "Steam Quick Export $tag" --generate-notes
          }
