name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Download FFmpeg bundle
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $bin = (Get-ChildItem $extractRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item (Join-Path $bin "ffmpeg.exe") .\ffmpeg.exe
          Copy-Item (Join-Path $bin "ffprobe.exe") .\ffprobe.exe
      - name: Build Steam Quick Export
        run: powershell -ExecutionPolicy Bypass -File .\build-quick.ps1
      - name: Smoke-test Steam Quick Export bundle
        shell: pwsh
        run: |
          # `&` does not reliably surface $LASTEXITCODE for this windowed exe;
          # Start-Process -Wait -PassThru does.
          $process = Start-Process -FilePath ".\dist-simple\SteamQuickExport\SteamQuickExport.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Steam Quick Export self-test failed ($($process.ExitCode))" }
      - name: Package release files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          # Steam Quick Export: same idea, but ffmpeg.exe/ffprobe.exe are plain
          # files inside the onedir bundle, so the no-ffmpeg variant is just a
          # copy of that folder with the two binaries stripped out.
          Compress-Archive -Path .\dist-simple\SteamQuickExport\* -DestinationPath ".\SteamQuickExport-$tag-win-x64-ffmpeg.zip"
          $noFfmpegDir = ".\dist-simple\SteamQuickExport-no-ffmpeg"
          Copy-Item .\dist-simple\SteamQuickExport $noFfmpegDir -Recurse
          Remove-Item (Join-Path $noFfmpegDir "ffmpeg.exe"), (Join-Path $noFfmpegDir "ffprobe.exe") -Force
          Compress-Archive -Path "$noFfmpegDir\*" -DestinationPath ".\SteamQuickExport-$tag-win-x64.zip"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds-${{ github.ref_name }}
          path: |
            SteamQuickExport-${{ github.ref_name }}-win-x64-ffmpeg.zip
            SteamQuickExport-${{ github.ref_name }}-win-x64.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "SteamQuickExport-$tag-win-x64-ffmpeg.zip",
            "SteamQuickExport-$tag-win-x64.zip"
          )
          gh release create "$tag" @assets --title "Steam Quick Export $tag" --generate-notes
