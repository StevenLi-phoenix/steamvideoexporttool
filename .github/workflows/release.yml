name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Download FFmpeg bundle
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $bin = (Get-ChildItem $extractRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item (Join-Path $bin "ffmpeg.exe") .\ffmpeg.exe
          Copy-Item (Join-Path $bin "ffprobe.exe") .\ffprobe.exe
      - name: Build standalone bundle
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1
      - name: Package release files
        shell: pwsh
        run: Compress-Archive -Path .\dist\SteamVideoExporter.exe, .\dist\ffmpeg.exe, .\dist\ffprobe.exe -DestinationPath .\SteamVideoExporter-${{ github.ref_name }}-win-x64.zip
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamVideoExporter-${{ github.ref_name }}-win-x64
          path: SteamVideoExporter-${{ github.ref_name }}-win-x64.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = "SteamVideoExporter-${{ github.ref_name }}-win-x64.zip"
          gh release create "${{ github.ref_name }}" $archive --title "Steam Video Exporter ${{ github.ref_name }}" --generate-notes
