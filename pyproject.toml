[project]
name = "steam-video-exporter"
version = "0.1.1"
description = "Modern Windows GUI for losslessly remuxing Steam Game Recording M4S files"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
]

[dependency-groups]
build = [
    "pyinstaller>=6.0,<7",
]
test = [
    "coverage>=7.15.2",
]

[tool.uv]
default-groups = ["build"]

[tool.coverage.run]
source = ["steam_exporter"]
omit = [
    "steam_exporter/ui.py",
    "steam_exporter/worker.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
