[project]
name = "steam-video-exporter"
version = "0.2.3"
description = "Modern Windows GUI for losslessly remuxing Steam Game Recording M4S files"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
]

[dependency-groups]
build = [
    "pyinstaller>=6.0,<7",
]
test = [
    "coverage>=7.15.2",
]
lint = [
    "ruff>=0.8,<1",
]

[tool.uv]
default-groups = ["build"]

[tool.coverage.run]
source = ["steam_exporter", "scripts"]
omit = [
    "steam_exporter/simple_ui.py",
    "steam_exporter/export_client.py",
    "steam_exporter/export_backend.py",
    "scripts/check_export_ipc.py",
    "scripts/benchmark_scan.py",
    "scripts/generate_icon.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["build-simple", "dist", "dist-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
